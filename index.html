<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SDSC MAP Course &middot; AI and the SDLC</title>
<style>
:root{--ink:#12263A;--slate:#27446B;--bg:#EEF3F8;--card:#fff;--line:#d5deea}
@media(prefers-color-scheme:dark){:root{--ink:#e6edf5;--slate:#9db8dc;--bg:#101821;--card:#192533;--line:#2b3b4e}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,Segoe UI,sans-serif}
main{max-width:720px;margin:0 auto;padding:40px 16px}
h1{margin:0 0 4px;font-size:1.7rem}
p.sub{margin:0 0 28px;color:var(--slate)}
ul{list-style:none;margin:0;padding:0;display:grid;gap:10px}
a.item{display:block;padding:14px 16px;background:var(--card);border:1px solid var(--line);border-radius:10px;color:inherit;text-decoration:none}
a.item:hover{border-color:var(--slate)}
</style></head><body><main>
<h1>AI and the SDLC</h1>
<p class="sub">Course materials, SDSC MAP</p>
<ul id="list"><li>Loading&hellip;</li></ul>
</main>
<script>
(async function(){
  var list=document.getElementById('list');
  try{
    var r=await fetch('https://api.github.com/repos/alexhwu/sdsc-map-2026/contents/html');
    if(!r.ok) throw new Error(r.status);
    var files=(await r.json()).filter(function(f){return /\.html?$/i.test(f.name)})
      .sort(function(a,b){return a.name.localeCompare(b.name,undefined,{numeric:true})});
    list.innerHTML='';
    files.forEach(function(f){
      var li=document.createElement('li'), a=document.createElement('a');
      a.className='item'; a.href='html/'+f.name; a.textContent=f.name.replace(/\.html?$/,'');
      li.appendChild(a); list.appendChild(li);
      fetch('html/'+f.name).then(function(x){return x.text()}).then(function(t){
        var m=t.match(/<title>([\s\S]*?)<\/title>/i);
        if(m){var d=document.createElement('div');d.innerHTML=m[1];a.textContent=d.textContent.trim()}
      }).catch(function(){});
    });
    if(!files.length) list.innerHTML='<li>No pages yet.</li>';
  }catch(e){
    list.innerHTML='<li><a class="item" href="html/week-01.html">Week 1</a></li>';
  }
})();
</script></body></html>
